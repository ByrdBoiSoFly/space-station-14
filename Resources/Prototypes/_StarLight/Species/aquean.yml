- type: species
  id: Aquean
  name: species-name-aquean
  roundStart: true
  prototype: MobAquean
  sprites: MobAqueanSprites
  defaultSkinTone: "#34a223"
  markingLimits: MobAqueanMarkingLimits
  dollPrototype: MobAqueanDummy
  skinColoration: Hues
  maleFirstNames: NamesReptilianMale # Placeholder, consider creating NamesAqueanMale
  femaleFirstNames: NamesReptilianFemale # Placeholder, consider creating NamesAqueanFemale
  naming: FirstDashFirst
  actions:
  - JumpAquean
  - ActionAqueanStickyTongue
  customName: true
  components:
  - type: InteractionPopup
    interactionDistance: 1.75

- type: speciesBaseSprites
  id: MobAqueanSprites
  sprites:
    Head: MobAqueanHead
    Snout: MobHumanoidAnyMarking
    UndergarmentTop: MobHumanoidAnyMarking
    UndergarmentBottom: MobHumanoidAnyMarking
    Chest: MobAqueanTorso
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    Eyes: MobHumanoidEyes
    LArm: MobAqueanLArm
    RArm: MobAqueanRArm
    LHand: MobAqueanLHand
    RHand: MobAqueanRHand
    LLeg: MobAqueanLLeg
    RLeg: MobAqueanRLeg
    LFoot: MobAqueanLFoot
    RFoot: MobAqueanRFoot

- type: markingPoints
  id: MobAqueanMarkingLimits
  onlyWhitelisted: true
  points:
    Hair:
      points: 0
      required: false
    FacialHair:
      points: 0
      required: false
    Snout:
      points: 1
      required: true
      defaultMarkings: [ LizardSnoutRound ] # Placeholder, consider Aquean specific markings
    HeadTop:
      points: 2
      required: false
    HeadSide:
      points: 1
      required: false
    UndergarmentTop:
      points: 1
      required: false
    UndergarmentBottom:
      points: 1
      required: false
    Chest:
      points: 4
      required: false
    Legs:
      points: 2
      required: false
    Arms:
      points: 2
      required: false

