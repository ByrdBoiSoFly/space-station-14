- type: entity
  abstract: true
  parent: BaseItem
  id: BasePlayingCard
  name: Playing Card
  description: A playing card. What could it be?
  components:
  - type: Sprite
    sprite: Objects/Fun/playingcards.rsi
    state: "cardback"
    scale: 0.5, 0.5
  - type: Item
    size: Tiny
  - type: Appearance
  - type: CardFlip
  - type: ItemSwitch
    state: back
    states:
      back: !type:ItemSwitchState
        verb: "Flip Face-Down"
        name: playing card
        description: A playing card. What could it be?
        soundStateActivate: /Audio/Items/Cards/card_flip.ogg
        sprite:
          sprite: Objects/Fun/playingcards.rsi
          state: "cardback"
        components:
        - type: Appearance
          visuals:
          - type: CardFlipVisualizer
            backState: "cardback"
      # The 'front' state must be fully defined by inheriting entities

