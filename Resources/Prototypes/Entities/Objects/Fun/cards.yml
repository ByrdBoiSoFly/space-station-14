- type: entity
  parent: BaseItem
  id: CardAceSpades
  name: ace of spades
  description: The highest card in the deck. A true classic.
  components:
  - type: Sprite
    sprite: Objects/Fun/playingcards.rsi
    # The card will spawn face-up, using this state.
    state: "ace_spades"
    # We also need a visualizer to connect our system's logic to the sprite.
    scale: 0.5, 0.5
    layers:
    - state: "ace_spades"
      map: ["enum.CardFlipVisuals.State"]
  - type: Item
    size: Tiny
  - type: Appearance # Needed for the visualizer to work.
  # This is your custom component!
  - type: CardFlip
    # Here you define the data fields from your C# component.
    frontState: "ace_spades"
    backState: "card_back"
